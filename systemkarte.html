button { font: inherit; color: inherit; }

.legend { display: grid; grid-template-columns: 46px 1fr; gap: 7px 10px; align-items: center; font-size: 12.5px; }
.legend svg { display: block; }
.note { font-size: 12px; color: var(--muted); }
.loops { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }

    document.getElementById("g-view").setAttribute("aria-label", t("view"));
    document.getElementById("g-lang").setAttribute("aria-label", t("lang"));
    [["z-in", "zin"], ["z-out", "zout"], ["z-fit", "fitT"], ["z-full", "full"]].forEach(([id, k]) => { const b = document.getElementById(id); b.title = t(k); b.setAttribute("aria-label", t(k)); });
  }

  // ---------- Zustand anwenden ----------
  let visEdges = [], loops = [];
  function apply() {
    document.getElementById("stage").classList.toggle("diff", state.view === "diff");
    nodeEls.forEach(({ n, g }) => {
      g.style.display = nodeOn(n) ? "" : "none";
      g.classList.toggle("fresh", state.chapter > 0 && n.chapter === state.chapter);
    });
    visEdges = [];
    edgeEls.forEach(o => {
      const on = edgeOn(o.e); o.path.style.display = o.lab.style.display = on ? "" : "none";
      if (!on) return;
      visEdges.push(o.e);
      const st = o.e.status, chg = st === "Geändert" && o.e.art === "Kausal";
      o.path.classList.toggle("new", st === "Neu");
      o.path.classList.toggle("gone", st === "Entfernen");
      o.path.classList.toggle("chg", chg);
      o.path.classList.toggle("keep", st === "Bestehend" || (st === "Geändert" && !chg));
      o.lab.classList.toggle("keep", st === "Bestehend");
      const old = state.chapter > 0 && o.e.chapter < state.chapter;
      o.path.classList.toggle("old", old); o.lab.classList.toggle("old", old);
    });
    loops = findLoops(visEdges.filter(causal), 12);
    if (state.sel && !nodeOn(byId[state.sel])) state.sel = null;
    if (state.loop && !loopAvailable(state.loop)) state.loop = null;
    renderTexts(); highlight();
  }
  function renderTexts() {
    const nv = DATA.nodes.filter(nodeOn).length, r = loops.filter(l => l.type === "R").length;
    document.getElementById("meta").textContent = t("meta")(DATA.generated, nv, visEdges.length, loops.length, r);
    renderSteps(); renderCaption(); renderSide();
  }

  // ---------- Hervorheben ----------
  let hovered = null;
  function hover(id) { hovered = id; highlight(); }
  function highlight() {
    const hotN = new Set(), hotE = new Set();
    const focusId = hovered || state.sel;
    svg.classList.remove("loopmode");
    if (state.loop && !hovered) {
      state.loop.nodes.forEach(n => hotN.add(n)); state.loop.edges.forEach(e => hotE.add(e)); svg.classList.add("loopmode");
    } else if (focusId) {
      hotN.add(focusId);
      visEdges.forEach(e => { if (e.src === focusId || e.dst === focusId) { hotE.add(e); hotN.add(e.src); hotN.add(e.dst); } });
    }
    svg.classList.toggle("focus", hotN.size > 0);
    nodeEls.forEach(({ n, g }) => { g.classList.toggle("hot", hotN.has(n.id)); g.classList.toggle("sel", state.sel === n.id); });
    edgeEls.forEach(o => { const h = hotE.has(o.e); o.path.classList.toggle("hot", h); o.lab.classList.toggle("hot", h); });
  }

  // ---------- Kapitel ----------
  function renderSteps() {
    const s = document.getElementById("steps"); s.textContent = "";
    const mk = (n, txt, title) => { const b = document.createElement("button"); b.textContent = txt; b.title = title; b.className = n === 0 ? "step-all" : ""; b.setAttribute("aria-pressed", String(state.chapter === n)); b.onclick = () => { state.chapter = n; state.loop = null; apply(); }; s.appendChild(b); };
    mk(0, t("all"), t("allT"));
    DATA.chapters.forEach(c => mk(c.n, String(c.n), `${t("chap")} ${c.n}: ${L(c.title, c.title_en)}`));
  }
  function renderCaption() {
    const cap = document.getElementById("cap");
    if (!state.chapter) { cap.innerHTML = t("capAll"); return; }
    const c = chapterOf[state.chapter];
    const fresh = DATA.nodes.filter(n => nodeOn(n) && n.chapter === c.n).length;
    cap.innerHTML = `<b>${t("chap")} ${c.n} · ${esc(L(c.title, c.title_en))}</b> <span class="q">· ${esc(L(c.question, c.question_en))}</span>
      <div class="aha"><b>AHA:</b> ${esc(L(c.aha, c.aha_en))}</div>
      <div class="meta">${t("levers")}: ${esc(nodeList(c.levers) || "–")}${c.event ? ` · ${t("event")}: ${esc(nodeList(c.event))}` : ""}${c.cbm ? ` · ${t("cbm")}: ${esc(c.cbm)}` : ""} · ${t("fresh")(fresh)}</div>`;
  }

  // ---------- Detailspalte ----------
  function keyLoop(kl) {
    const nodes = kl.nodes, edges = [];
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i], b = nodes[(i + 1) % nodes.length];
      const e = visEdges.find(x => x.src === a && x.dst === b && causal(x));
      if (!e) return null;
      edges.push(e);
    }
    return { id: "k:" + kl.name, kl, nodes, edges, type: edges.filter(e => minus(e.pol)).length % 2 ? "B" : "R" };
  }
  function loopAvailable(l) { return l.edges.every(e => visEdges.includes(e)); }
  function chainHTML(l) {
    let h = "";
    l.nodes.forEach((n, i) => { const e = l.edges[i]; h += `${esc(label(byId[n]))} <span class="s ${minus(e.pol) ? "m" : "p"}">${minus(e.pol) ? "−→" : "+→"}</span> `; });
    return h + esc(label(byId[l.nodes[0]]));
  }
  function loopItem(l, name, sub) {
    const pressed = !!(state.loop && state.loop.id === l.id);
    return `<li><button data-loop="${esc(l.id)}" aria-pressed="${pressed}"><span class="lt ${l.type}">${l.type}</span><span class="nm">${esc(name)}<span class="chain">${sub}</span></span><span class="len">${l.nodes.length}</span></button></li>`;
  }
  const legendSVG = inner => `<svg width="46" height="22" viewBox="0 0 46 22" aria-hidden="true">${inner}</svg>`;
  const LEG = [
    `<rect x="3" y="3" width="40" height="16" rx="2" style="fill:var(--lever);stroke:var(--lever-edge)"/>`,
    `<rect x="3" y="3" width="40" height="16" rx="2" style="fill:var(--lever);stroke:var(--prereq);stroke-width:2.4"/>`,
    `<rect x="3" y="3" width="40" height="16" rx="2" style="fill:var(--surface);stroke:var(--fg);stroke-width:1.9"/>`,
    `<rect x="3" y="3" width="40" height="16" rx="8" style="fill:var(--surface);stroke:var(--line-strong)"/>`,
    `<rect x="3" y="3" width="40" height="16" rx="2" style="fill:var(--event-bg);stroke:var(--minus);stroke-width:1.5"/>`,
    `<rect x="3" y="3" width="40" height="16" rx="2" style="fill:var(--surface);stroke:var(--line-strong);stroke-dasharray:5 3"/>`,
    `<path d="M2 11 H38" style="stroke:var(--plus);stroke-width:1.5"/><path d="M36 7 L43 11 L36 15z" style="fill:var(--plus)"/>`,
    `<path d="M2 11 H38" style="stroke:var(--minus);stroke-width:1.5"/><path d="M36 7 L43 11 L36 15z" style="fill:var(--minus)"/>`,
    `<path d="M2 11 H38" style="stroke:var(--plus);stroke-width:1.5;stroke-dasharray:6 4"/><path d="M36 7 L43 11 L36 15z" style="fill:var(--plus)"/>`,
    `<path d="M2 11 H38" style="stroke:var(--prereq);stroke-width:1.6;stroke-dasharray:2 4"/><path d="M36 7 L43 11 L36 15z" style="fill:var(--prereq)"/>`
  ];

  let sideLoops = [];
  function renderSide() {
    if (state.sel) return renderNode(byId[state.sel]);
    const r = loops.filter(l => l.type === "R").length;
    const kls = DATA.keyLoops.map(kl => ({ kl, l: keyLoop(kl) }));
    sideLoops = kls.map(x => x.l).filter(Boolean);
    side.innerHTML = `
      <h2>${t("overview")}</h2>
      <div class="stats">
        <div class="stat"><div class="n">${DATA.nodes.filter(nodeOn).length}</div><div class="l">${t("vars")}</div></div>
        <div class="stat"><div class="n">${visEdges.length}</div><div class="l">${t("rels")}</div></div>
        <div class="stat"><div class="n">${loops.length}</div><div class="l">${t("loops")}</div><div class="sub">${r} R · ${loops.length - r} B</div></div>
      </div>
      <h3>${t("keyLoops")}</h3>
      <ul class="loops">${kls.map(({ kl, l }) => l
        ? loopItem(l, L(kl.name, kl.name_en), esc(L(kl.note, kl.note_en)))
        : `<li><button disabled><span class="lt">·</span><span class="nm">${esc(L(kl.name, kl.name_en))}<span class="chain">${t("incomplete")}</span></span><span></span></button></li>`).join("")}</ul>
      <h3>${t("legend")}</h3>
      <div class="legend">${LEG.map((g, i) => legendSVG(g) + `<span>${t("lg")[i]}</span>`).join("")}</div>
      <p class="note" style="margin-top:12px">${t("note1")}</p>
      <p class="note">${t("note2")}</p>`;
    bindLoopButtons();
  }

  function renderNode(n) {
    const outs = visEdges.filter(e => e.src === n.id), ins = visEdges.filter(e => e.dst === n.id);
    const mine = loops.filter(l => l.nodes.includes(n.id)).sort((a, b) => a.nodes.length - b.nodes.length);
    const shown = mine.slice(0, 12).map((l, i) => { const k = l.nodes.indexOf(n.id); return { ...l, id: `n:${n.id}:${i}`, nodes: l.nodes.slice(k).concat(l.nodes.slice(0, k)), edges: l.edges.slice(k).concat(l.edges.slice(0, k)) }; });
    sideLoops = shown;
    const rel = (e, other) => {
      const k = e.art === "Voraussetzung" ? "v" : minus(e.pol) ? "m" : "p";
      const desc = L(e.desc_de, e.desc), reason = L(e.reason, e.reason_en);
      return `<li><span class="pol ${k}">${k === "v" ? "V" : minus(e.pol) ? "−" : "+"}</span><div>
        <button class="who" data-sel="${esc(other)}">${esc(label(byId[other]))}</button>
        ${e.status !== "Bestehend" ? ` <span class="chip st-${esc(e.status)}">${esc(en(e.status))}</span>` : ""}
        <div class="d">${esc(desc)}${e.strength ? ` · ${t("strength")}: ${esc(en(e.strength))}` : ""}${e.delay ? ` · ${t("delay")}: ${esc(en(e.delay))}` : ""}</div>
        ${reason ? `<div class="r">${esc(reason)}</div>` : ""}</div></li>`;
    };
    const other = state.lang === "de" ? n.en : n.de;
    const comment = L(n.comment, n.comment_en);
    side.innerHTML = `
      <button class="back" id="back">${t("back")}</button>
      <h2>${esc(label(n))}</h2>
      <div class="note">${esc(other)}</div>
      <div class="chips"><span class="chip">${esc(en(n.area))}</span><span class="chip">${esc(en(n.type))}</span><span class="chip">${t("chap")} ${n.chapter}</span><span class="chip st-${esc(n.status)}">${esc(en(n.status))}</span></div>
      ${comment ? `<p class="note">${esc(comment)}</p>` : ""}
      <h3>${t("affects")} (${outs.length})</h3>
      ${outs.length ? `<ul class="rel">${outs.map(e => rel(e, e.dst)).join("")}</ul>` : `<p class="note">${t("noOut")}</p>`}
      <h3>${t("affected")} (${ins.length})</h3>
      ${ins.length ? `<ul class="rel">${ins.map(e => rel(e, e.src)).join("")}</ul>` : `<p class="note">${t("noIn")(n.type)}</p>`}
      <h3>${t("loopsThrough")} (${mine.length})</h3>
      ${mine.length ? `<ul class="loops">${shown.map(l => loopItem(l, `${t(l.type)} · ${t("nVars")(l.nodes.length)}`, chainHTML(l))).join("")}</ul>${mine.length > 12 ? `<p class="note" style="margin-top:6px">${t("shortest")}</p>` : ""}` : `<p class="note">${t("noLoop")}</p>`}`;
    document.getElementById("back").onclick = () => { state.sel = null; state.loop = null; highlight(); renderSide(); };
    side.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => select(b.dataset.sel));
    bindLoopButtons();
  }

  function bindLoopButtons() {
    side.querySelectorAll(".loops button[data-loop]").forEach(b => {
      b.onclick = () => {
        const l = sideLoops.find(x => x.id === b.dataset.loop); if (!l) return;
        state.loop = state.loop && state.loop.id === l.id ? null : l;
        side.querySelectorAll(".loops button[data-loop]").forEach(x => x.setAttribute("aria-pressed", String(!!state.loop && x.dataset.loop === state.loop.id)));
        highlight();
      };
    });
  }

  function select(id) {
    state.sel = id; state.loop = null; hovered = null;
    highlight(); renderSide(); side.scrollTop = 0;
  }

  // ---------- Zoom & Verschieben ----------
  const vb = { x: 0, y: 0, w: W, h: H };
  const setVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function fit() { vb.x = -10; vb.y = 20; vb.w = W + 20; vb.h = H - 10; setVB(); }
  function toSvg(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function zoomAt(f, cx, cy) {
    const nw = Math.min(W * 1.6, Math.max(W / 10, vb.w * f)); f = nw / vb.w;
    vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; vb.h *= f; setVB();
  }
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = toSvg(ev.clientX, ev.clientY); zoomAt(Math.exp(ev.deltaY * 0.0015), p.x, p.y); }, { passive: false });
  let drag = null, dragMoved = false;
  svg.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY, p: toSvg(ev.clientX, ev.clientY), id: ev.pointerId }; dragMoved = false; });
  svg.addEventListener("pointermove", ev => {
    if (!drag) return;
    if (!dragMoved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 4) { dragMoved = true; svg.classList.add("dragging"); svg.setPointerCapture(drag.id); }
    if (!dragMoved) return;
    const p = toSvg(ev.clientX, ev.clientY); vb.x -= p.x - drag.p.x; vb.y -= p.y - drag.p.y; setVB();
  });
  const end = () => { drag = null; svg.classList.remove("dragging"); setTimeout(() => (dragMoved = false), 0); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("click", () => { if (dragMoved) return; if (state.sel || state.loop) { state.sel = null; state.loop = null; highlight(); renderSide(); } });
  const center = () => [vb.x + vb.w / 2, vb.y + vb.h / 2];
  document.getElementById("z-in").onclick = () => zoomAt(0.75, ...center());
  document.getElementById("z-out").onclick = () => zoomAt(1 / 0.75, ...center());
  document.getElementById("z-fit").onclick = fit;
  document.getElementById("z-full").onclick = () => {
    const st = document.getElementById("stage");
    if (document.fullscreenElement) document.exitFullscreen?.(); else st.requestFullscreen?.().catch(() => {});
  };
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (state.sel || state.loop)) { state.sel = null; state.loop = null; highlight(); renderSide(); } });

  // ---------- Bedienelemente ----------
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    state.view = b.dataset.view; state.loop = null;
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); apply();
  });
  function setLang(l) {
    state.lang = l; try { localStorage.setItem("circulus-lang", l); } catch (e) {}
    document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === l)));
    staticTexts(); drawLabels(); renderTexts();
  }
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));

  fit(); setLang(state.lang); apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLabels);
})();
</script>

</html>
