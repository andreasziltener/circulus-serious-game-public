  --band-ink: #A5B4BA;
  --plus: #AEBBC1; --minus: #FF7B5E; --prereq: #B597FF;
  --lever: #E7C24A; --lever-edge: #8F7210; --lever-ink: #1E1A0A;
  --event-bg: #3A2019; --ext-bg: #26323A;

} }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.app { height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; }
.title h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.ctl-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 6px; }

/* Kapitel-Leiste */
.chapters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.steps { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.steps button { min-width: 30px; height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-family: var(--font-mono); font-size: 12px; padding: 0 9px; }
.steps button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.steps .step-all { font-family: var(--font-ui); }
.cap { flex: 1 1 380px; min-width: 0; font-size: 13px; }
.cap b { font-weight: 600; }
.cap .q { color: var(--muted); }
.cap .aha { margin-top: 2px; }
.cap .meta { margin-top: 2px; color: var(--muted); font-size: 12px; }

/* Hauptbereich */
.main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stage svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
.stage svg.dragging { cursor: grabbing; }
.zoom { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16px; line-height: 1; display: grid; place-items: center; }
.zoom button.wide { width: auto; padding: 0 10px; font-size: 12.5px; }
.hint { position: absolute; right: 12px; bottom: 12px; font-size: 11.5px; color: var(--muted); background: var(--surface); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line); }

.side { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.side h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
.side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.side p { margin: 0 0 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 4px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.stat .n { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--muted); }
.stat .sub { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.legend { display: grid; grid-template-columns: 46px 1fr; gap: 7px 10px; align-items: center; font-size: 12.5px; }
.legend svg { display: block; }
.note { font-size: 12px; color: var(--muted); }
.loops { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.loops button { width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 6px 8px; border-radius: 7px; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; }
.loops button:hover { background: var(--bg); }
.loops button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.loops button:disabled { opacity: .45; cursor: default; }
.loops .nm { font-size: 13px; font-weight: 500; }
.loops .chain { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.loops .len { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.lt { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--surface); }
.lt.R { background: var(--loop-r); } .lt.B { background: var(--loop-b); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
.chip { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.chip.st-Neu { border-color: var(--accent); color: var(--accent); }
.chip.st-Geändert, .chip.st-Umbenannt { border-color: var(--prereq); color: var(--prereq); }
.chip.st-Entfernen { border-color: var(--minus); color: var(--minus); }
.chip.st-emp { border-color: var(--loop-b); color: var(--loop-b); }
.ev { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }
.rel { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rel li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.pol { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-family: var(--font-mono); font-weight: 500; border: 1.5px solid currentColor; }
.pol.p { color: var(--plus); } .pol.m { color: var(--minus); } .pol.v { color: var(--prereq); border-style: dashed; }

.chainlist .s { font-family: var(--font-mono); padding: 0 4px; }
.chainlist .s.m { color: var(--minus); } .chainlist .s.p { color: var(--plus); }

.band-label { font-family: var(--font-ui); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; fill: var(--band-ink); }
.band-sub { font-family: var(--font-ui); font-size: 12px; fill: var(--band-ink); opacity: .85; }
.edge { fill: none; stroke-width: 1.25; opacity: .78; transition: opacity .15s; }

.edge.old { opacity: .38; }
.plab { font-family: var(--font-mono); font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.plab.p { fill: var(--plus); } .plab.m { fill: var(--minus); } .plab.v { display: none; }

.node rect.box { stroke-width: 1.1; }
.node.t-ind rect.box { fill: var(--surface); stroke: var(--line-strong); }
.node.t-stock rect.box { fill: var(--surface); stroke: var(--fg); stroke-width: 1.9; }
.node.t-lever rect.box { fill: var(--lever); stroke: var(--lever-edge); stroke-width: 1.4; }
.node.t-lever.cbm rect.box { stroke: var(--prereq); stroke-width: 2.4; }
.node.t-event rect.box { fill: var(--event-bg); stroke: var(--minus); stroke-width: 1.5; }
.node.t-ext rect.box { fill: var(--ext-bg); stroke: var(--muted); stroke-width: 1.4; }
.node.s-new rect.box { stroke-dasharray: 5 3; }

.node.s-gone text { text-decoration: line-through; }
.node text { font-family: var(--font-label); font-size: 12.5px; font-weight: 500; fill: var(--fg); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node.t-lever text { fill: var(--lever-ink); }
.node text.k { font-family: var(--font-mono); font-size: 9px; font-weight: 500; fill: var(--muted); text-anchor: end; }
.node.t-lever text.k { fill: var(--lever-ink); opacity: .6; }
.node rect.halo { fill: none; stroke: var(--accent); stroke-width: 3.5; opacity: 0; }
.node.fresh rect.halo { opacity: .55; }
.node:hover rect.box { filter: brightness(.97); }
.node.sel rect.halo { opacity: 1; }
svg.focus .edge, svg.focus .plab, svg.focus .node { opacity: .12; }

svg.focus .edge.hot { stroke-width: 2.4; }
svg.loopmode .edge.hot.p, svg.loopmode .edge.hot.m { stroke-width: 3; }
.diff .node.s-new rect.box, .diff .node.s-chg rect.box { stroke: var(--accent); stroke-width: 2.4; }
.diff .node.s-old { opacity: .55; }
.diff .edge.new, .diff .edge.chg { stroke: var(--accent); stroke-width: 2; opacity: 1; }
.diff .node.s-emp rect.box { stroke: var(--loop-b); stroke-width: 2.4; }
.diff .edge.emp { stroke: var(--loop-b); }
.diff .edge.keep { opacity: .22; }
.diff .plab.keep { opacity: .3; }
.diff .edge.gone { stroke: var(--minus); opacity: .9; stroke-width: 1.8; }
@media (prefers-reduced-motion: reduce) { .edge { transition: none; } }

@media (max-width: 900px) {

Zustand","status":"Geändert","chapter":6,"comment":"War Hebel; wird durch Investition und zirkuläres Produktdesign aufgebaut (Rückmeldung Team: Beziehung Produktdesign → Modularität ergänzt). Mehr Modularität heisst: mehr Teile lassen sich aufbereiten oder wieder in der Produktion einsetzen.","comment_en":"Was a lever; built up through investment and circular product design (team feedback: link product design → modularity added). More modularity means more parts can be refurbished or reused in production.","evidence":"","x":640,"y":1390},{"id":"Circularity Compatibility of the Components","en":"Circularity Compatibility of the Components","de":"Zirkuläre Kompatibilität der Komponenten","area":"Ökologie","type":"Zustand","status":"Bestehend","chapter":6,"comment":"","comment_en":"","evidence":"","x":990,"y":1390},{"id":"Product Lifetime","en":"Product Lifetime","de":"Produktlebensdauer","area":"Ökologie","type":"Indikator","status":"Bestehend","chapter":2,"comment":"","comment_en":"","evidence":"","x":100,"y":1496},{"id":"Material Circularity Index %","en":"Material Circularity Index %","de":"Material Circularity Index (MCI)","area":"Ökologie","type":"Indikator","status":"Bestehend","chapter":1,"comment":"Ellen MacArthur Foundation: MCI.","comment_en":"Ellen MacArthur Foundation: MCI.","evidence":"","x":1860,"y":1390},{"id":"Recovered Material Inflow","en":"Recovered Material Inflow","de":"Rückgewonnener Materialzufluss","area":"Ökologie","type":"Indikator","status":"Umbenannt","chapter":2,"comment":"War 'Material Inflow'. Neuer Name vermeidet Verwechslung mit Rohstoffzufuhr.","comment_en":"Was 'Material Inflow'. New name avoids confusion with virgin material input.","evidence":"","x":1390,"y":1390},{"id":"Material Outflow","en":"Material Outflow","de":"Materialabfluss (Abfall)","area":"Ökologie","type":"Indikator","status":"Bestehend","chapter":1,"comment":"","comment_en":"","evidence":"","x":1650,"y":1390},{"id":"CO2","en":"CO2","de":"CO2-Emissionen","area":"Ökolog & Servicepartner einbinden","area":"Wirtschaft","type":"Hebel","status":"Neu (Empirie)","chapter":4,"comment":"","comment_en":"","evidence":"","x":1860,"y":1028},{"id":"Upgrade in the Field","en":"Upgrade in the Field","de":"Upgrade im Feld","area":"Wirtschaft","type":"Hebel","status":"Neu (Empirie)","chapter":6,"comment":"","comment_en":"","evidence":"","x":160,"y":1028},{"id":"Refurbished Positioning","en":"Refurbished Positioning","de":"Positionierung Refurbished","area":"Wirtschaft","type":"Hebel","status":"Geändert","chapter":4,"comment":"","comment_en":"","evidence":"","x":1860,"y":672},{"id":"Second-hand Stigma","en":"Second-hand Stigma","de":"Occasion-Stigma","area":"Wirtschaft","type":"Indikator","status":"Neu (Empirie)","chapter":4,"comment":"","comment_en":"","evidence":"","x":1900,"y":778},{"id":"Resilience","en":"Resilience","de":"Resilienz (Material & Ersatzteile)","area":"Wirtschaft","type":"Indikator","status":"Neu","chapter":2,"comment":"Entscheid Team (Q14): dritte Ergebnisgrösse neben Marge und CO2. Wie gut die Firma Material und Ersatzteile auch in Krisen sichern kann.","comment_en":"Team decision (Q14): third outcome alongside margin and CO2. How well the company can secure materials and spare parts, even in a crisis.","evidence":"","x":1030,"y":1028},{"id":"Remanufacturing","en":"Remanufacturing","de":"Remanufacturing (Teile zurück in die Produktion)","area":"Wirtschaft","type":"Indikator","status":"Neu","chapter":6,"comment":"Rückmeldung Team: Ist die Modularität schon im Produktdesign angelegt, fliessen gebrauchte Teile wieder in die Produktion neuer Geräte. Spart Material, CO2 und Kosten und steigert die Produktivität.","comment_en":"Team feedback: if modularity is built in through product design, used parts flow back into the production of new products. Saves material, CO2 and costs and raises productivity.","evidence":"","x":1230,"y":1028},{"id":"Circular Process Experience","en":"Circular Process Experience","de":"Erfahrung in Kreislaufprozessen (Lernkurve)","area":"Organisation","type":"Zustand","status":"Neu","chapter":2,"comment":"Rückmeldung Team: Lernkurve in Service, Triage, Rücklogistik, Demontage und Refurbishment. Wächst mit der Praxis (Bestand, wird im Rechenkern aufsummiert) und geht mit Fluktuation verloren. Zu Beginn kommen nur die besten Geräte zurück; mit der Erfahrung erkennen die Mitarbeitenden, welche Teile hohen Wert oder hohe Umweltbelastung haben, und leiten mehr davon in Rückführung und Demontage.","comment_en":"Team feedback: learning curve in service, triage, reverse logistics, disassembly and refurbishment. Grows with practice (a stock that accumulates in the simulation) and is lost with turnover. At first only the best products come back; with experience staff learn which parts carry high value or high environmental impact and route more of them into returns and disassembly.","evidence":"","x":1285,"y":316},{"id":"Pay-per-use Fleet","en":"Pay-per-use Fleet","de":"Pay-per-use-Flotte (Geräte in Miete)","area":"Wirtschaft","type":"Zustand","status":"Neu","chapter":7,"comment":"Rückmeldung Team: Mit Pay-per-use (Product-as-a-Service) bleiben die Geräte im Besitz der Firma und bringen wiederkehrende Mieteinnahmen. Die Miete deckt die Gerätekosten in etwa fünf Jahren, danach wird nur noch verdient. Bestand: wächst, solange neue Verträge abgeschlossen werden.","comment_en":"Team feedback: with pay-per-use (product-as-a-service) the products stay owned by the company and generate recurring rental revenue. The rent covers the product cost in about five years; after that it is pure profit. A stock that grows while new contracts are signed.","evidence":"","x":1650,"y":672},{"id":"Price-sensitive Markets","en":"Price-sensitive Markets","de":"Neue preissensitive Märkte (Refurbished)","area":"Wirtschaft","type":"Indikator","status":"Neu","chapter":4,"comment":"Rückmeldung Team: Mit Refurbished-Geräten lassen sich neue, vor allem preissensitive Märkte bedienen, die Neuprodukte nicht errei ückmeldung Team zum Testlauf.","desc":"Own used parts bridge supply gaps for new parts.","desc_de":"Eigene gebrauchte Teile überbrücken Lieferlücken bei Neuteilen.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":6},{"id":"R186","src":"Refurbished Positioning","dst":"Customer Acceptance of Circular Offers","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"A price about 10% below new and a clear positioning make refurbished attractive.","desc_de":"Ein Preis rund 10 % unter neu und eine klare Positionierung machen Refurbished attraktiv.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":4},{"id":"R187","src":"Refurbishment","dst":"Circular Process Experience","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"Every refurbished unit teaches the team something.","desc_de":"Jedes aufbereitete Gerät bringt dem Team Erfahrung.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":2},{"id":"R188","src":"Triage of Circular Components","dst":"Circular Process Experience","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"Triage teaches which parts carry high value or high environmental impact.","desc_de":"In der Triage lernen die Mitarbeitenden, welche Teile hohen Wert oder hohe Umweltbelastung haben.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":5},{"id":"R189","src":"Remanufacturing","dst":"Circular Process Experience","pol":"+","art":"Kausal","strength":"schwach","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"Reusing parts in production builds know-how in disassembly and testing.","desc_de":"Teile wieder in der Produktion einzusetzen baut Know-how in Demontage und Prüfung auf.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":6},{"id":"R190","src":"Labor Turnover Rate","dst":"Circular Process Experience","pol":"-","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"When experienced staff leave, their know-how goes with them.","desc_de":"Wenn erfahrene Mitarbeitende gehen, geht ihr Wissen mit.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":3},{"id":"R191","src":"Circular Process Experience","dst":"Return Quality","pol":"+","art":"Kausal","strength":"stark","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"With experience, more valuable parts are recognised and routed back.","desc_de":"Mit Erfahrung werden mehr wertvolle Teile erkannt und zurückgeführt.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":5},{"id":"R192","src":"Circular Process Experience","dst":"Return Volume","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"Experienced staff route more parts into reverse logistics and disassembly.","desc_de":"Erfahrene Mitarbeitende leiten mehr Teile in Rücklogistik und Demontage.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":5},{"id":"R193","src":"Circular Process Experience","dst":"Productivity","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"Learning curves in service, triage, logistics and refurbishment raise productivity.","desc_de":"Lernkurven in Service, Triage, Logistik und Refurbishment steigern die Produktivität.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":3},{"id":"R194","src":"Cashflow","dst":"Sustainability Fund","pol":"+","art":"Kausal","strength":"stark","delay":"kurz","status":"Neu","reason":"Rückmeldung Team zum Testlauf.","desc":"The levy is a share of the contribution margins: more cash flow, more money in the fund.","desc_de":"Die Abgabe ist ein Anteil der Deckungsbeiträge: mehr Cashflow, mehr Geld im Fonds.","reason_en":"Team feedback on the test run.","evidence":"","source":"Rückmeldung Team zum Testlauf (2026-11-05)","row":null,"chapter":2},{"id":"R195","src":"D Pay-per-use","dst":"Pay-per-use Fleet","pol":"+","art":"Kausal","strength":"mittel","delay":"kurz","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Every new pay-per-use contract adds a product to the rental fleet.","desc_de":"Jeder neue Pay-per-use-Vertrag bringt ein Gerät in die Mietflotte.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R196","src":"Customer Acceptance of Circular Offers","dst":"Pay-per-use Fleet","pol":"+","art":"Kausal","strength":"schwach","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Customers who accept circular offers are more willing to rent instead of buy.","desc_de":"Kunden, die zirkuläre Angebote annehmen, mieten eher statt zu kaufen.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R197","src":"Pay-per-use Fleet","dst":"Revenue","pol":"+","art":"Kausal","strength":"stark","delay":"keine","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Every product in the fleet brings in rent every month: recurring revenue.","desc_de":"Jedes Gerät in der Flotte bringt jeden Monat Miete: wiederkehrender Umsatz.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R198","src":"D Pay-per-use","dst":"Costs","pol":"+","art":"Kausal","strength":"schwach","delay":"keine","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"The company pre-finances the rented products; the rent covers this in about five years.","desc_de":"Die Firma finanziert die Mietgeräte vor; die Miete deckt das in etwa fünf Jahren.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R199","src":"Pay-per-use Fleet","dst":"Return Volume","pol":"+","art":"Kausal","strength":"mittel","delay":"lang","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"At the end of a contract the product comes back and can be refurbished.","desc_de":"Am Vertragsende kommt das Gerät zurück und kann aufbereitet werden.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R200","src":"Refurbishment","dst":"Price-sensitive Markets","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Refurbished products about 10% below new reach customers who cannot afford new products.","desc_de":"Refurbished-Geräte rund 10 % unter neu erreichen Kunden, die sich Neuprodukte nicht leisten.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":4},{"id":"R201","src":"Refurbished Positioning","dst":"Price-sensitive Markets","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Actively marketing refurbished opens up new customer segments.","desc_de":"Refurbished aktiv zu vermarkten erschliesst neue Kundensegmente.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":4},{"id":"R202","src":"Low-cost Competition","dst":"Price-sensitive Markets","pol":"-","art":"Kausal","strength":"schwach","delay":"kurz","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Low-cost competitors contest the price-sensitive markets.","desc_de":"Billigkonkurrenz macht die preissensitiven Märkte streitig.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":4},{"id":"R203","src":"Price-sensitive Markets","dst":"Revenue","pol":"+","art":"Kausal","strength":"mittel","delay":"kurz","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"New markets bring additional revenue without replacing new sales.","desc_de":"Neue Märkte bringen zusätzlichen Umsatz, ohne Neuverkäufe zu ersetzen.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":4},{"id":"R204","src":"Price-sensitive Markets","dst":"Installed Base","pol":"+","art":"Kausal","strength":"schwach","delay":"lang","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Products sold in new markets enlarge the installed base and later returns.","desc_de":"In neuen Märkten verkaufte Geräte vergrössern die installierte Basis und spätere Rückläufe.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":4},{"id":"R205","src":"Circular Process Experience","dst":"Costs","pol":"-","art":"Kausal","strength":"stark","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik; Stärke auf «stark» erhöht (tiefere Kosten aus der Lernkurve).","desc":"With experience, refurbishment and remanufacturing become cheaper per unit.","desc_de":"Mit Erfahrung werden Refurbishment und Remanufacturing pro Stück günstiger.","reason_en":"Team feedback on the revenue logic; strength raised to 'strong' (lower costs from the learning curve).","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":2},{"id":"R206","src":"Remanufacturing","dst":"Costs","pol":"-","art":"Kausal","strength":"stark","delay":"kurz","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Used parts in production replace purchased new parts.","desc_de":"Gebrauchte Teile in der Produktion ersetzen zugekaufte Neuteile.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":6},{"id":"R207","src":"Pay-per-use Fleet","dst":"Costs","pol":"-","art":"Kausal","strength":"schwach","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"As the fleet grows, part of the rent finances new rental products; less pre-financing is needed.","desc_de":"Mit wachsender Flotte finanziert ein Teil der Miete neue Mietgeräte; es braucht weniger Vorfinanzierung.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":7},{"id":"R208","src":"Circular Process Experience","dst":"Transformation Capability","pol":"+","art":"Kausal","strength":"mittel","delay":"mittel","status":"Neu","reason":"Rückmeldung Team zur Ertragslogik.","desc":"Experience stays in the line organisation even when the core team is scaled down.","desc_de":"Die Erfahrung bleibt in der Linie, auch wenn das Kernteam verkleinert wird.","reason_en":"Team feedback on the revenue logic.","evidence":"","source":"Rückmeldung Team zur Ertragslogik (2026-11-05)","row":null,"chapter":3}],"chapters":[{"n":1,"title":"Die Vision","question":"Was priorisieren wir?","levers":"Investment in Circularity, Price, Marketing","event":"Strategic CE Focus, Economic Situation, Regulatory Pressure","cbm":"","aha":"CE verändert die Kriterien für gute Entscheidungen; es braucht einen CBM-Plan.\nOhne Entscheidungen bleibt alles, wie es ist, auch der CO2-Ausstoss.\nWer in Zirkularität investiert, sieht zuerst einen tieferen Cashflow.","title_en":"The Vision","question_en":"What do we prioritise?","aha_en":"CE changes the criteria for good decisions; a CBM plan is needed.\nWithout decisions everything stays as it is, including CO2 emissions.\nInvesting in circularity first lowers cash flow."},{"n":2,"title":"Die erste Ernüchterung","question":"Recycling, Reparatur oder Kreislauf?","levers":"Recycling, A Machine Repair, B1 Component Circulation, Sustainability Fund","event":"","cbm":"A, B1","aha":"Recycling ist besser als nichts, aber nicht der stärkste Hebel: Reparatur und Komponentenkreislauf senken CO2 deutlich mehr.\nDer Einstieg erfolgt oft aus der Not (Ersatzteilknappheit, Garantiekosten), nicht aus der Vision.\nEigene Kreislaufteile machen resilient, wenn Lieferanten ausfallen.\nRefurbishment konkurriert mit dem eigenen Ersatzteilgeschäft.","title_en":"The First Disillusionment","question_en":"Recycling, repair or circulation?","aha_en":"Recycling is better than nothing but not the strongest lever: repair and component circulation cut CO2 much more.\nThe entry often comes out of necessity (spare-part shortages, warranty costs), not out of vision.\nOwn circular parts make the company resilient when suppliers fail.\nRefurbishment competes with the company's own spare-parts business."},{"n":3,"title":"Die Organisationskrise","question":"Wer trägt die Transformation?","levers":"Cross-functional Team, Partner Integration, Anchoring","event":"Champion Departure","cbm":"","aha":"Ohne Organisation kein Refurbishment: Wer zuerst Team, Partner und Verankerung aufbaut, erreicht mit weniger Budget mehr.\nIch muss nicht alles selbst machen. Buy-in ist zentral.\nOhne Sponsor stirbt das Projekt; Verankern macht den Wandel unabhängig von einzelnen Personen.","title_en":"The Organisational Crisis","question_en":"Who carries the transformation?","aha_en":"No refurbishment without organisation: building team, partners and anchoring first achieves more with less budget.\nI don't have to do everything myself. Buy-in is key.\nWithout a sponsor the project dies; anchoring makes the change independent of individuals."},{"n":4,"title":"Der Kundenschock","question":"Wie reagiert der Markt?","levers":"Marketing, Refurbished Positioning, Sales & Service Partner Involvement","event":"Preference for New Products, Low-cost Competition","cbm":"","aha":"Kunden fragen weiterhin nach Neuprodukten, und zirkuläre Angebote kannibalisieren den Neuverkauf.\nRefurbished ist rund 10 % günstiger und hat den kleineren CO2-Fussabdruck; die Positionierung entscheidet über Stigma und Akzeptanz.\nRefurbished erschliesst neue, preissensitive Märkte.\nZirkularität impliziert Serviceorientierung.","title_en":"The Customer Shock","question_en":"How does the market react?","aha_en":"Customers keep asking for new products, and circular offers cannibalise new sales.\nRefurbished costs about 10% less and has a smaller CO2 footprint; positioning decides on stigma and acceptance.\nRefurbished opens up new, price-sensitive markets.\nCircularity implies service orientation."},{"n":5,"title":"Der Supply-Chain-Schock","question":"Woher kommen die Rückläufe?","levers":"B2 Machine Circulation, Partner Integration","event":"Supply Chain Shock","cbm":"B2","aha":"Rückläufe ermöglichen erst Zirkularität; Qualität und Volumen sind kritisch.\nMaschine ≠ Komponente: Der Produktkreislauf (B2) kommt nach dem Komponentenkreislauf (B1).\nMit Erfahrung wird die Triage besser: Zuerst kommen nur die besten Geräte zurück, später auch wertvolle Teile.","title_en":"The Supply Chain Shock","question_en":"Where do the returns come from?","aha_en":"Returns are what make circularity possible; quality and volume are critical.\nMachine ≠ component: product circulation (B2) comes after component circulation (B1).\nTriage improves with experience: at first only the best products come back, later valuable parts too."},{"n":6,"title":"Die Produkttransformation","question":"Was muss im Design anders werden?","levers":"Circular Product Design, Investment in Circularity, Upgrade in the Field","event":"","cbm":"","aha":"Modularität beginnt im Produktdesign: Langlebigkeit, Reparierbarkeit und Upgrades entstehen dort.\nMit modularen Produkten fliessen gebrauchte Teile zurück in die Produktion (Remanufacturing).\nGutes Design kostet zuerst Entwicklungsaufwand.","title_en":"The Product Transformation","question_en":"What has to change in the design?","aha_en":"Modularity starts in product design: longevity, repairability and upgrades originate there.\nWith modular products, used parts flow back into production (remanufacturing).\nGood design first costs development effort."},{"n":7,"title":"Die Skalierungsfrage","question":"Wie wird aus dem Pilot ein Geschäft?","levers":"Scaling Investment, C Combined M&C Flows, D Pay-per-use","event":"","cbm":"C, D","aha":"Real Cases pushen Pilotprojekte; die Transformation muss handhabbar bleiben.\nC setzt B1 und B2 voraus, D setzt C voraus.\nPay-per-use kostet zuerst (Vorfinanzierung) und trägt sich nach rund fünf Jahren; danach sind die Mieten wiederkehrender Ertrag.\nDie Krise kippt die Prioritäten, und Refurbishment puffert.","title_en":"The Scaling Question","question_en":"How does a pilot become a business?","aha_en":"Real cases push pilot projects; the transformation must stay manageable.\nC requires B1 and B2, D requires C.\nPay-per-use costs first (pre-financing) and pays off after about five years; after that the rent is recurring income.\nA crisis flips priorities, and refurbishment acts as a buffer."},{"n":8,"title":"Die Reifephase","question":"Wirkt die Transformation?","levers":"KPI System","event":"","cbm":"","aha":"Zirkularität messen ist nicht straightforward, aber notwendig.\nMit Lernkurve und Remanufacturing sinken die Kosten über die Zeit.\nDas Team kann in die Linie überführt werden; das Wissen bleibt.\nAm Ende muss es sich lohnen: nach zehn Jahren beim Cashflow mindestens so gut wie Abwarten, bei CO2 und Resilienz deutlich besser.","title_en":"The Maturity Phase","question_en":"Does the transformation work?","aha_en":"Measuring circularity is not straightforward, but necessary.\nWith the learning curve and remanufacturing, costs fall over time.\nThe team can be handed over to the line; the know-how stays.\nIn the end it has to pay off: after ten years at least as good as waiting on cash flow, clearly better on CO2 and resilience."}],"keyLoops":[{"name":"Sponsor-Kreislauf","nodes":["Champion Strength","Management Support"],"note":"Treibende Personen halten das Management am Thema, ein sichtbarer Sponsor stärkt sie.","name_en":"Sponsor loop","note_en":"Champions keep management engaged, and a visible sponsor strengthens them."},{"name":"Investitionsbremse","nodes":["Cashflow","Investment in Circularity"],"note":"Investitionen in Zirkularität kosten Cashflow und bremsen sich damit selbst.","name_en":"Investment brake","note_en":"Investing in circularity costs cashflow and thus slows itself down."},{"name":"Business Case","nodes":["Cashflow","Management Support","Investment in Circularity"],"note":"Ein guter Cashflow bringt Management Support, die Investition belastet aber den Cashflow.","name_en":"Business case","note_en":"Good cashflow earns management support, but the investment drains cashflow."},{"name":"CO2-Reputation","nodes":["Purchase Decision","Sales","Production Volume","Material Outflow","CO2","Customer Trust"],"note":"Mehr Absatz bedeutet mehr Abfall und CO2. Das kostet Vertrauen und bremst den Absatz.","name_en":"CO2 reputation","note_en":"More sales mean more waste and CO2. That costs trust and slows sales."},{"name":"Ersatzteil-Konflikt","nodes":["Refurbishment","Spare Parts & Service Business","Revenue","Cashflow","Management Support","Buy-in","Transformation Capability"],"note":"Refurbishment ersetzt Ersatzteilverkäufe, das kostet Umsatz und schwächt den Rückhalt für weiteres Refurbishment.","name_en":"Spare-parts conflict","note_en":"Refurbishment replaces spare-part sales, which costs revenue and weakens support for more refurbishment."},{"name":"Kannibalisierung","nodes":["Purchase Decision","Sales","Installed Base","Circular Market Volume"],"note":"Zirkuläre Angebote aus der installierten Basis ersetzen teilweise den Kauf neuer Maschinen.","name_en":"Cannibalisation","note_en":"Circular offers from the installed base partly replace purchases of new machines."},{"name":"Komplexitätsgrenze","nodes":["Circular Market Volume","Complexity","Transformation Capability","Refurbishment"],"note":"Wachsendes zirkuläres Geschäft erhöht die Komplexität und begrenzt die Transformationsfähigkeit.","name_en":"Complexity limit","note_en":"A growing circular business adds complexity and limits transformation capability."},{"name":"Überlastung","nodes":["Transformation Capability","Refurbishment","Circular Market Volume","Complexity","Employee Satisfaction","Buy-in"],"note":"Komplexität belastet die Mitarbeitenden, sinkendes Buy-in bremst die Transformation.","name_en":"Overload","note_en":"Complexity strains employees, falling buy-in slows the transformation."},{"name":"Vertrauen & Zusammenarbeit","nodes":["Customer Trust","Customer Collaboration"],"note":"Vertrauen ermöglicht Datenaustausch mit Kunden, Zusammenarbeit stärkt das Vertrauen.","name_en":"Trust & collaboration","note_en":"Trust enables data sharing with customers, collaboration builds trust."},{"name":"Vertrauen durch Service","nodes":["Cashflow","Investment in Circularity","Modularity of the Product","Service Quality","Customer Trust","Purchase Decision","Sales","Revenue"],"note":"Investitionen in Modularität verbessern den Service, das Vertrauen und den Umsatz.","name_en":"Trust through service","note_en":"Investing in modularity improves service, trust and revenue."},{"name":"Langlebigkeits-Dilemma","nodes":["Investment in Circularity","Modularity of the Product","Product Lifetime","Purchase Decision","Sales","Revenue","Cashflow"],"note":"Langlebigere Maschinen senken den Ersatzbedarf und damit den Umsatz, der die Investition finanziert.","name_en":"Longevity dilemma","note_en":"Longer-lasting machines reduce replacement demand and thus the revenue that funds the investment."},{"name":"Rückläufe senken Kosten","nodes":["Installed Base","Return Volume","Reverse Logistic","Recovered Material Inflow","Costs","Cashflow","Investment in Circularity","Modularity of the Product","Service Quality","Customer Trust","Purchase Decision","Sales"],"note":"Rückläufe liefern günstiges Material, das stärkt Cashflow, Investition, Service und Absatz.","name_en":"Returns lower costs","note_en":"Returns provide cheap material, which strengthens cashflow, investment, service and sales."},{"name":"Referenzfälle","nodes":["Circular Market Volume","Real Cases","Customer Acceptance of Circular Offers"],"note":"Erfolgreiche zirkuläre Projekte überzeugen weitere Kunden.","name_en":"Reference cases","note_en":"Successful circular projects convince more customers."},{"name":"Evidenz","nodes":["Measurability","Management Support","Buy-in","Transformation Capability"],"note":"Messbare Ergebnisse sichern Management Support und Buy-in, das stärkt die Fähigkeit zu messen.","name_en":"Evidence","note_en":"Measurable results secure management support and buy-in, which strengthens the ability to measure."},{"name":"Resilienz-Kreislauf","nodes":["Resilience","Management Support","Buy-in","Transformation Capability","Refurbishment"],"note":"Gesicherte Versorgung in der Krise überzeugt das Management. Mehr Rückhalt stärkt das Refurbishment, und das sichert wiederum Material und Ersatzteile.","name_en":"Resilience loop","note_en":"Secured supply in a crisis convinces management. More backing strengthens refurbishment, which in turn secures materials and spare parts."}]};

    if (state.sel) return renderNode(byId[state.sel]);
    const r = loops.filter(l => l.type === "R").length;
    const kls = DATA.keyLoops.map(kl => ({ kl, l: keyLoop(kl) }));
    sideLoops = kls.map(x => x.l).filter(Boolean);
    side.innerHTML = `
      <h2>${t("overview")}</h2>
      <div class="stats">
        <div class="stat"><div class="n">${DATA.nodes.filter(nodeOn).length}</div><div class="l">${t("vars")}</div></div>
        <div class="stat"><div class="n">${visEdges.length}</div><div class="l">${t("rels")}</div></div>
        <div class="stat"><div class="n">${loops.length}</div><div class="l">${t("loops")}</div><div class="sub">${r} R · ${loops.length - r} B</div></div>
      </div>
      <h3>${t("keyLoops")}</h3>
      <ul class="loops">${kls.map(({ kl, l }) => l
        ? loopItem(l, L(kl.name, kl.name_en), esc(L(kl.note, kl.note_en)))
        : `<li><button disabled><span class="lt">·</span><span class="nm">${esc(L(kl.name, kl.name_en))}<span class="chain">${t("incomplete")}</span></span><span></span></button></li>`).join("")}</ul>
      <h3>${t("legend")}</h3>
      <div class="legend">${LEG.map((g, i) => legendSVG(g) + `<span>${t("lg")[i]}</span>`).join("")}</div>
      <p class="note" style="margin-top:12px">${t("note1")}</p>
      <p class="note">${t("note2")}</p>`;
    bindLoopButtons();
  }

  function renderNode(n) {
    const outs = visEdges.filter(e => e.src === n.id), ins = visEdges.filter(e => e.dst === n.id);
    const mine = loops.filter(l => l.nodes.includes(n.id)).sort((a, b) => a.nodes.length - b.nodes.length);
    const shown = mine.slice(0, 12).map((l, i) => { const k = l.nodes.indexOf(n.id); return { ...l, id: `n:${n.id}:${i}`, nodes: l.nodes.slice(k).concat(l.nodes.slice(0, k)), edges: l.edges.slice(k).concat(l.edges.slice(0, k)) }; });
    sideLoops = shown;
    const rel = (e, other) => {
      const k = e.art === "Voraussetzung" ? "v" : minus(e.pol) ? "m" : "p";
      const desc = L(e.desc_de, e.desc), reason = L(e.reason, e.reason_en);
      return `<li><span class="pol ${k}">${k === "v" ? "V" : minus(e.pol) ? "−" : "+"}</span><div>
        <button class="who" data-sel="${esc(other)}">${esc(label(byId[other]))}</button>
        ${e.status !== "Bestehend" ? ` <span class="chip ${esc(chipCls(e.status))}">${esc(en(e.status))}</span>` : ""}
        <div class="d">${esc(desc)}${e.strength ? ` · ${t("strength")}: ${esc(en(e.strength))}` : ""}${e.delay ? ` · ${t("delay")}: ${esc(en(e.delay))}` : ""}</div>
        ${reason ? `<div class="r">${esc(reason)}</div>` : ""}${e.evidence ? `<div class="ev">${t("evidence")}: ${esc(e.evidence)}</div>` : ""}</div></li>`;
    };
    const other = state.lang === "de" ? n.en : n.de;
    const comment = L(n.comment, n.comment_en);
    side.innerHTML = `
      <button class="back" id="back">${t("back")}</button>
      <h2>${esc(label(n))}</h2>
      <div class="note">${esc(other)}</div>
      <div class="chips"><span class="chip">${esc(en(n.area))}</span><span class="chip">${esc(en(n.type))}</span><span class="chip">${t("chap")} ${n.chapter}</span><span class="chip ${esc(chipCls(n.status))}">${esc(en(n.status))}</span></div>
      ${comment ? `<p class="note">${esc(comment)}</p>` : ""}
      ${n.evidence ? `<p class="ev">${t("evidence")}: ${esc(n.evidence)}</p>` : ""}
      <h3>${t("affects")} (${outs.length})</h3>
      ${outs.length ? `<ul class="rel">${outs.map(e => rel(e, e.dst)).join("")}</ul>` : `<p class="note">${t("noOut")}</p>`}
      <h3>${t("affected")} (${ins.length})</h3>
      ${ins.length ? `<ul class="rel">${ins.map(e => rel(e, e.src)).join("")}</ul>` : `<p class="note">${t("noIn")(n.type)}</p>`}
      <h3>${t("loopsThrough")} (${mine.length})</h3>
      ${mine.length ? `<ul class="loops">${shown.map(l => loopItem(l, `${t(l.type)} · ${t("nVars")(l.nodes.length)}`, chainHTML(l))).join("")}</ul>${mine.length > 12 ? `<p class="note" style="margin-top:6px">${t("shortest")}</p>` : ""}` : `<p class="note">${t("noLoop")}</p>`}`;
    document.getElementById("back").onclick = () => { state.sel = null; state.loop = null; highlight(); renderSide(); };
    side.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => select(b.dataset.sel));
    bindLoopButtons();
  }

  function bindLoopButtons() {
    side.querySelectorAll(".loops button[data-loop]").forEach(b => {
      b.onclick = () => {
        const l = sideLoops.find(x => x.id === b.dataset.loop); if (!l) return;
        state.loop = state.loop && state.loop.id === l.id ? null : l;
        side.querySelectorAll(".loops button[data-loop]").forEach(x => x.setAttribute("aria-pressed", String(!!state.loop && x.dataset.loop === state.loop.id)));
        highlight();
      };
    });
  }

  function select(id) {
    state.sel = id; state.loop = null; hovered = null;
    highlight(); renderSide(); side.scrollTop = 0;
  }

  // ---------- Zoom & Verschieben ----------
  const vb = { x: 0, y: 0, w: W, h: H };
  const setVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  function fit() { vb.x = -10; vb.y = 20; vb.w = W + 20; vb.h = H - 10; setVB(); }
  function toSvg(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function zoomAt(f, cx, cy) {
    const nw = Math.min(W * 1.6, Math.max(W / 10, vb.w * f)); f = nw / vb.w;
    vb.x = cx - (cx - vb.x) * f; vb.y = cy - (cy - vb.y) * f; vb.w *= f; vb.h *= f; setVB();
  }
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = toSvg(ev.clientX, ev.clientY); zoomAt(Math.exp(ev.deltaY * 0.0015), p.x, p.y); }, { passive: false });
  let drag = null, dragMoved = false;
  svg.addEventListener("pointerdown", ev => { drag = { x: ev.clientX, y: ev.clientY, p: toSvg(ev.clientX, ev.clientY), id: ev.pointerId }; dragMoved = false; });
  svg.addEventListener("pointermove", ev => {
    if (!drag) return;
    if (!dragMoved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 4) { dragMoved = true; svg.classList.add("dragging"); svg.setPointerCapture(drag.id); }
    if (!dragMoved) return;
    const p = toSvg(ev.clientX, ev.clientY); vb.x -= p.x - drag.p.x; vb.y -= p.y - drag.p.y; setVB();
  });
  const end = () => { drag = null; svg.classList.remove("dragging"); setTimeout(() => (dragMoved = false), 0); };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("click", () => { if (dragMoved) return; if (state.sel || state.loop) { state.sel = null; state.loop = null; highlight(); renderSide(); } });
  const center = () => [vb.x + vb.w / 2, vb.y + vb.h / 2];
  document.getElementById("z-in").onclick = () => zoomAt(0.75, ...center());
  document.getElementById("z-out").onclick = () => zoomAt(1 / 0.75, ...center());
  document.getElementById("z-fit").onclick = fit;
  document.getElementById("z-full").onclick = () => {
    const st = document.getElementById("stage");
    if (document.fullscreenElement) document.exitFullscreen?.(); else st.requestFullscreen?.().catch(() => {});
  };
  document.addEventListener("keydown", ev => { if (ev.key === "Escape" && (state.sel || state.loop)) { state.sel = null; state.loop = null; highlight(); renderSide(); } });

  // ---------- Bedienelemente ----------
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    state.view = b.dataset.view; state.loop = null;
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); apply();
  });
  function setLang(l) {
    state.lang = l; try { localStorage.setItem("circulus-lang", l); } catch (e) {}
    document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === l)));
    staticTexts(); drawLabels(); renderTexts();
  }
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));

  fit(); setLang(state.lang); apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawLabels);
})();
</script>

</html>
